<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bassline to Tab</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100">
  <main class="mx-auto max-w-3xl px-4 py-10">
    <header class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight">Bassline to Tab</h1>
      <p class="mt-2 text-stone-600 dark:text-stone-400">
        Upload a song and get its bass line as tablature. The bass is separated from the mix with
        Demucs and transcribed with Basic Pitch.
      </p>
    </header>

    <form id="form" class="space-y-6 rounded-xl border border-stone-200 bg-white p-6 shadow-sm dark:border-stone-800 dark:bg-stone-900">
      <div>
        <label for="audio" class="mb-2 block text-sm font-medium">Audio file</label>
        <label id="drop" for="audio"
          class="flex cursor-pointer flex-col items-center justify-center rounded-lg border-2 border-dashed border-stone-300 px-4 py-8 text-center transition hover:border-amber-500 dark:border-stone-700">
          <span id="file-label" class="text-stone-600 dark:text-stone-400">Click to choose a file, or drop it here</span>
          <span class="mt-1 text-xs text-stone-500">wav, mp3, flac, ogg, m4a, aac</span>
        </label>
        <input id="audio" name="audio" type="file" accept=".wav,.mp3,.flac,.ogg,.m4a,.aac,audio/*" class="sr-only" required>
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label for="tuning" class="mb-2 block text-sm font-medium">Bass tuning</label>
          <select id="tuning" class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 dark:border-stone-700 dark:bg-stone-950">
            <option value="standard">Standard (E A D G)</option>
            <option value="drop-d">Drop D</option>
            <option value="half-step-down">Half step down</option>
            <option value="d-standard">D standard</option>
            <option value="five-string">5 strings (B E A D G)</option>
            <option value="six-string">6 strings (B E A D G C)</option>
            <option value="custom">Custom...</option>
          </select>
          <input id="tuning-custom" type="text" placeholder="E1 A1 D2 G2" maxlength="100" hidden
            class="mt-2 w-full rounded-lg border border-stone-300 bg-white px-3 py-2 font-mono text-sm dark:border-stone-700 dark:bg-stone-950">
        </div>
        <div>
          <label for="bpm" class="mb-2 block text-sm font-medium">Tempo (BPM)</label>
          <input id="bpm" type="number" min="30" max="300" step="any" placeholder="Estimate automatically"
            class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 dark:border-stone-700 dark:bg-stone-950">
        </div>
        <div>
          <label for="frets" class="mb-2 block text-sm font-medium">Frets</label>
          <input id="frets" type="number" min="12" max="36" value="24"
            class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 dark:border-stone-700 dark:bg-stone-950">
        </div>
        <label class="flex items-start gap-3 self-end pb-2">
          <input id="separate" type="checkbox" checked class="mt-1 h-4 w-4 accent-amber-600">
          <span class="text-sm">
            Separate the bass with Demucs
            <span class="block text-xs text-stone-500">Turn off only for an isolated bass recording.</span>
          </span>
        </label>
      </div>

      <button id="submit" type="submit"
        class="w-full rounded-lg bg-amber-600 px-4 py-3 font-semibold text-white transition hover:bg-amber-700 disabled:cursor-not-allowed disabled:opacity-50">
        Transcribe
      </button>
    </form>

    <section id="status" class="mt-6 hidden rounded-xl border border-stone-200 bg-white p-6 dark:border-stone-800 dark:bg-stone-900" aria-live="polite">
      <div class="flex items-center gap-3">
        <svg id="spinner" class="h-5 w-5 animate-spin text-amber-600" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"></circle>
          <path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
        </svg>
        <p id="status-text" class="font-medium"></p>
      </div>
      <div id="upload-bar" class="mt-4 hidden h-2 overflow-hidden rounded-full bg-stone-200 dark:bg-stone-800">
        <div id="upload-fill" class="h-full w-0 bg-amber-600 transition-all"></div>
      </div>
      <p id="progress" class="mt-3 truncate font-mono text-xs text-stone-500"></p>
      <p id="error" class="mt-3 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800 dark:bg-red-950 dark:text-red-200" role="alert"></p>
    </section>

    <section id="result" class="mt-6 hidden">
      <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-xl font-semibold">Tablature</h2>
        <div class="flex flex-wrap gap-2 text-sm">
          <button id="copy" type="button" class="rounded-lg border border-stone-300 px-3 py-1.5 hover:bg-stone-100 dark:border-stone-700 dark:hover:bg-stone-800">Copy</button>
          <button id="download-tab" type="button" class="rounded-lg border border-stone-300 px-3 py-1.5 hover:bg-stone-100 dark:border-stone-700 dark:hover:bg-stone-800">Download .txt</button>
          <a id="download-midi" href="#" hidden class="rounded-lg border border-stone-300 px-3 py-1.5 hover:bg-stone-100 dark:border-stone-700 dark:hover:bg-stone-800">Download MIDI</a>
        </div>
      </div>
      <pre id="tab" class="overflow-x-auto rounded-xl border border-stone-200 bg-white p-4 font-mono text-sm leading-tight dark:border-stone-800 dark:bg-stone-900"></pre>
      <p class="mt-3 text-xs text-stone-500">Results are deleted from the server after one hour.</p>
    </section>

    <footer class="mt-12 text-center text-xs text-stone-500">
      <a class="underline hover:text-stone-700 dark:hover:text-stone-300" href="https://github.com/joaquin-p-olivera/bassline-to-tab">Source on GitHub</a>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
