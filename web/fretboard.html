<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bass Fretboard · Bassline to Tab</title>
  <meta name="description" content="Every fret of a standard-tuned bass (E A D G) with the note it plays.">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    /* Plain CSS so the neck keeps its shape even if the Tailwind CDN fails. */
    #neck-scroll { overflow-x: auto; }
    #neck {
      display: grid;
      grid-template-columns: 2.5rem 3rem repeat(var(--frets), minmax(3rem, 1fr));
      width: max-content;
      min-width: 100%;
    }
    #neck .label { position: sticky; left: 0; z-index: 1; display: flex; align-items: center; justify-content: center; }
    #neck .marker { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; }
    #neck .fret { border-left: 2px solid rgb(168 162 158); }
    #neck .open { border-right: 6px solid rgb(120 113 108); }
    #neck .cell { position: relative; min-height: 2.75rem; }
    /* The string runs through the middle of each cell. */
    #neck .cell::before {
      content: ""; position: absolute; left: 0; right: 0; top: 50%;
      height: var(--gauge); background: rgb(168 162 158); transform: translateY(-50%);
    }
    #neck .cell.open::before { display: none; }
    #neck .note {
      position: relative; margin: 0.375rem auto; display: flex; height: 2rem; min-width: 2.25rem;
      align-items: baseline; justify-content: center; border-radius: 9999px; padding: 0.25rem 0.375rem;
      font-size: 0.875rem; font-weight: 600; line-height: 1.5rem; cursor: pointer;
    }
    #neck .note[aria-pressed="true"] { background: rgb(245 158 11); border-color: rgb(217 119 6); color: white; }
  </style>
</head>
<body class="min-h-screen bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100">
  <main class="mx-auto max-w-5xl px-4 py-10">
    <header class="mb-8">
      <a href="./" class="text-sm text-stone-500 underline hover:text-stone-700 dark:hover:text-stone-300">← Bassline to Tab</a>
      <h1 class="mt-2 text-3xl font-bold tracking-tight">Bass fretboard</h1>
      <p class="mt-2 text-stone-600 dark:text-stone-400">
        Every fret of a standard-tuned bass (E A D G) and the note it plays. The highest string is on top, as in a tab.
        Tap a fret to hear it.
      </p>
    </header>

    <section class="space-y-4 rounded-xl border border-stone-200 bg-white p-4 shadow-sm sm:p-6 dark:border-stone-800 dark:bg-stone-900">
      <div class="flex flex-wrap items-center gap-x-6 gap-y-3 text-sm">
        <label class="flex items-center gap-2">
          Frets
          <select id="fret-count" class="rounded-md border border-stone-300 bg-transparent px-2 py-1 dark:border-stone-700">
            <option value="12" selected>12</option>
            <option value="20">20</option>
            <option value="24">24</option>
          </select>
        </label>
        <label class="flex items-center gap-2">
          Names
          <select id="notation" class="rounded-md border border-stone-300 bg-transparent px-2 py-1 dark:border-stone-700">
            <option value="sharps" selected>Sharps (C♯)</option>
            <option value="flats">Flats (D♭)</option>
          </select>
        </label>
        <label class="flex items-center gap-2">
          <input id="show-octave" type="checkbox" class="h-4 w-4 accent-amber-600">
          Show octave
        </label>
        <label class="flex items-center gap-2">
          <input id="highlight" type="checkbox" class="h-4 w-4 accent-amber-600">
          Highlight the note I tap everywhere on the neck
        </label>
      </div>

      <p id="selection" class="hidden text-sm text-stone-600 dark:text-stone-400" aria-live="polite"></p>

      <div id="neck-scroll" class="overflow-x-auto rounded-lg border border-stone-200 dark:border-stone-800" tabindex="0" aria-label="Fretboard, scrolls sideways">
        <div id="neck" role="group" aria-label="Fretboard">
          <!-- Filled by fretboard.js. -->
        </div>
      </div>
      <p class="text-xs text-stone-500 sm:hidden">Swipe sideways to see the higher frets.</p>
    </section>

    <footer class="mt-12 text-center text-xs text-stone-500">
      <a class="underline hover:text-stone-700 dark:hover:text-stone-300" href="./tuner.html">Bass tuner</a>
      ·
      <a class="underline hover:text-stone-700 dark:hover:text-stone-300" href="https://github.com/joaquin-p-olivera/bassline-to-tab">Source on GitHub</a>
    </footer>
  </main>
  <script type="module" src="./fretboard.js"></script>
</body>
</html>
