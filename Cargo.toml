[workspace]
members = ["crates/core", "crates/web"]
default-members = ["crates/core"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/joaquin-p-olivera/bassline-to-tab"

[profile.dev.package."*"]
# Dependencies (tract in particular) are unusably slow without optimizations.
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
