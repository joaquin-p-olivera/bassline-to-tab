[package]
name = "bassline-web"
description = "WebAssembly bindings: bass separation (Demucs on WebGPU) and transcription"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
bassline-core = { path = "../core" }
# Autotune stays off: on Apple mobile GPUs it benchmarks every kernel shape on
# first inference and hangs the device (see demucs-rs commit 76a5ac0).
burn = { version = "0.20.1", default-features = false, features = ["std", "wgpu", "fusion"] }
console_error_panic_hook = "0.1"
console_log = "1"
demucs-core = { git = "https://github.com/nikhilunni/demucs-rs", rev = "5d9f61a2e15987c5ea9a9fe92300b64d994bcd12", features = ["wgpu", "fusion"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
