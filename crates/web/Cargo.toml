[package]
name = "bassline-web"
description = "WebAssembly bindings: bass separation (Demucs on WebGPU) and transcription"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Benchmarks GPU kernel variants on first use and keeps the fastest. Much
# faster separation on desktop GPUs, but on Apple mobile GPUs the benchmarking
# burst hangs the device (see demucs-rs commit 76a5ac0), so CI builds two
# variants: `pkg` (with autotune) and `pkg-mobile` (without).
autotune = ["burn/autotune", "demucs-core/autotune"]

[dependencies]
anyhow = "1"
bassline-core = { path = "../core" }
burn ={ version = "0.20.1", default-features = false, features = ["std", "wgpu", "fusion"] }
console_error_panic_hook = "0.1"
console_log = "1"
demucs-core = { git = "https://github.com/nikhilunni/demucs-rs", rev = "5d9f61a2e15987c5ea9a9fe92300b64d994bcd12", features = ["wgpu", "fusion"] }
js-sys = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Several dependencies pull in getrandom; on the web each version needs its
# JavaScript (crypto.getRandomValues) backend enabled explicitly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
