name: Web app checks

# Builds the site and runs the end-to-end tests on every push, on any branch.
# It never deploys: deploy.yml calls it (with `pages: true`) to build and test
# the commit it is about to publish, and only then deploys.
on:
  push:
    branches: ["**"]
  workflow_call:
    inputs:
      ref:
        description: 'Branch or commit to check out (empty: the triggering one)'
        type: string
        default: ''
      pages:
        description: Upload the built site as the GitHub Pages artifact
        type: boolean
        default: false

permissions:
  contents: read

# github.workflow is the caller's name when called from deploy.yml, so a push
# never cancels the checks of a deploy in progress, nor the other way round.
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.129
  # OAuth client for the amp's Google Drive sync, from the repository
  # variable (Settings → Secrets and variables → Actions → Variables).
  # build-web.sh writes it into the site's drive-config.js.
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

jobs:
  build:
    name: Build and test the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The WebAssembly modules depend only on the Rust sources and build
      # settings hashed here, so a change that touches none of them (only
      # web/, docs, the e2e tests) reuses the modules from the last build of
      # the same inputs and skips the Rust toolchain, the build and clippy,
      # which already passed on those exact sources. The site and the e2e
      # tests still run on this commit's web files.
      - name: Restore the WebAssembly modules built from the same Rust inputs
        id: wasm-cache
        uses: actions/cache/restore@v6
        with:
          path: wasm-pkg
          key: wasm-pkg-bindgen${{ env.WASM_BINDGEN_VERSION }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/**', 'crates/**', 'scripts/build-web.sh') }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.wasm-cache.outputs.cache-hit != 'true'
      - uses: taiki-e/install-action@v2
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}

      # Clippy runs as the compiler of the workspace crates during the release
      # build, so the wasm dependencies are compiled once instead of again by a
      # separate `cargo clippy` (dependencies still go through plain rustc).
      # CLIPPY_ARGS is how cargo-clippy passes `-- -D warnings` to clippy-driver.
      - name: Build the WebAssembly modules (with clippy) and assemble the site
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        env:
          RUSTC_WORKSPACE_WRAPPER: clippy-driver
          CLIPPY_ARGS: -D__CLIPPY_HACKERY__warnings__CLIPPY_HACKERY__
        run: |
          set -o pipefail
          if ! scripts/build-web.sh _site 2>&1 | tee build.log; then
            # Surface compiler errors as annotations, readable through the API.
            grep -E '^error' -A14 build.log | head -120 | split -l 30 - chunk_ || true
            for chunk in chunk_*; do
              echo "::error title=wasm build::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$chunk")"
            done
            exit 1
          fi

      - name: Save the WebAssembly modules for builds with the same Rust inputs
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: cp -r _site/pkg wasm-pkg
      - uses: actions/cache/save@v6
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          path: wasm-pkg
          key: ${{ steps.wasm-cache.outputs.cache-primary-key }}

      - name: Assemble the site with the reused WebAssembly modules
        if: steps.wasm-cache.outputs.cache-hit == 'true'
        env:
          PREBUILT_PKG: wasm-pkg
        run: scripts/build-web.sh _site

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: End-to-end test (isolated bass, no separation)
        working-directory: web/e2e
        run: |
          pip install --quiet numpy
          npm install
          npx playwright install --with-deps chromium
          set -o pipefail
          if ! npx playwright test --reporter=list 2>&1 | tee e2e.log; then
            tail -60 e2e.log | split -l 30 - chunk_
            for chunk in chunk_*; do
              echo "::error title=e2e::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$chunk")"
            done
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        if: inputs.pages
        with:
          path: _site
